<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Installable PWA frontend for the waelio local AI research agent."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>@waelio/agent</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="drawer" aria-label="App drawer">
        <div class="drawer-title">@waelio/agent</div>
        <p class="drawer-subtitle">
          Cloudflare-ready PWA frontend for your local FastAPI chat backend.
        </p>
        <nav class="drawer-nav" aria-label="Primary navigation">
          <a class="drawer-link" data-path="/" href="/">Chat</a>
          <a class="drawer-link" data-path="/social" href="/social">Social</a>
        </nav>
        <div class="drawer-meta">
          <button id="install-btn" class="install-btn" hidden>
            Install app
          </button>

          <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">
            🌗 Theme
          </button>

          <p class="drawer-hint">
            Connect this frontend to a local FastAPI server or any
            compatible backend.
          </p>
        </div>
      </aside>

      <main class="page">
        <div id="answer-nav" hidden>
          <button id="ans-prev" class="ans-nav-btn" title="Previous answer">&#8593; Prev</button>
          <span id="ans-counter" class="ans-counter">1 / 1</span>
          <button id="ans-next" class="ans-nav-btn" title="Next answer">Next &#8595;</button>
        </div>
        <div id="chat"></div>
        <form id="form">
          <div id="model-bar">
            <label for="model-select" id="model-label">Model</label>
            <select id="model-select" title="Select AI model"></select>
          </div>
          <div id="composer">
            <input
              id="input"
              placeholder="Ask the researcher anything..."
              autocomplete="off"
            />
            <button id="btn">Send</button>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
