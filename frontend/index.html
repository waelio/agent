<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Installable PWA frontend for the waelio ADK research agent."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>AI Researcher</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="drawer" aria-label="App drawer">
        <div class="drawer-title">Agent</div>
        <p class="drawer-subtitle">
          Cloudflare-ready PWA frontend for your ADK chat experience.
        </p>
        <nav class="drawer-nav" aria-label="Primary navigation">
          <a class="drawer-link" data-path="/" href="/">Chat</a>
          <a class="drawer-link" data-path="/social" href="/social">Social</a>
        </nav>
        <div class="drawer-meta">
          <button id="install-btn" class="install-btn" hidden>
            Install app
          </button>
          <form id="backend-form" class="backend-form">
            <label class="backend-label" for="backend-url">Server URL</label>
            <input
              id="backend-url"
              class="backend-input"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://your-agent-server.example.com"
            />
            <div class="backend-actions">
              <button id="backend-save" class="backend-save" type="submit">
                Connect
              </button>
              <button id="backend-reset" class="backend-reset" type="button">
                Reset
              </button>
            </div>
            <p
              id="backend-status"
              class="backend-status"
              role="status"
              aria-live="polite"
            ></p>
          </form>
          <p class="drawer-hint">
            This app is already connected to the live agent server. Change the
            server URL above only if you want to test a different one.
          </p>
        </div>
      </aside>

      <main class="page">
        <div id="chat"></div>
        <form id="form">
          <input
            id="input"
            placeholder="Ask the researcher anything..."
            autocomplete="off"
          />
          <button id="btn">Send</button>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
