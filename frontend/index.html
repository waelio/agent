<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Researcher</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .app-shell {
        min-height: 100vh;
        display: flex;
      }
      .drawer {
        width: 220px;
        padding: 24px 16px;
        border-right: 1px solid #222;
        background: #121212;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .drawer-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .drawer-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drawer-link {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        color: #cbd5e1;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .drawer-link:hover {
        background: #1e293b;
        color: #ffffff;
      }
      .drawer-link.is-active {
        background: #2563eb;
        color: #ffffff;
      }
      .page {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        align-self: flex-end;
        background: #2563eb;
      }
      .agent {
        align-self: flex-start;
        background: #1e1e1e;
        border: 1px solid #333;
      }
      .thinking {
        opacity: 0.5;
        font-style: italic;
      }
      #form {
        display: flex;
        gap: 8px;
        padding: 16px;
        border-top: 1px solid #222;
      }
      #input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 24px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #f0f0f0;
        font-size: 15px;
        outline: none;
      }
      #input:focus {
        border-color: #2563eb;
      }
      button {
        padding: 12px 24px;
        border-radius: 24px;
        border: none;
        background: #2563eb;
        color: white;
        font-size: 15px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      @media (max-width: 720px) {
        .app-shell {
          flex-direction: column;
        }
        .drawer {
          width: auto;
          padding: 16px;
          border-right: none;
          border-bottom: 1px solid #222;
        }
        .drawer-nav {
          flex-direction: row;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="drawer" aria-label="App drawer">
        <div class="drawer-title">Agent</div>
        <nav class="drawer-nav" aria-label="Primary navigation">
          <a class="drawer-link" data-path="/" href="/">Chat</a>
          <a class="drawer-link" data-path="/social" href="/social">Social</a>
        </nav>
      </aside>

      <main class="page">
        <div id="chat"></div>
        <form id="form">
          <input
            id="input"
            placeholder="Ask the researcher anything..."
            autocomplete="off"
          />
          <button id="btn">Send</button>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
